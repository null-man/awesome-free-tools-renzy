name: Link Check

# Checks every link in the list and reports broken ones.
# It is intentionally non-blocking (fail: false) so a temporarily
# down website never shows a scary red ❌ on the repo.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 4
            --accept 200,204,206,429
            './**/*.md'
          fail: false
